[project]
name = "vaultserver"
version = "0.1.0"
description = "MCP-Server, Suchindex und Web-Oberfläche für einen Markdown-Vault"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mcp>=2.3,<3",
    "markdown-it-py>=3",
    "mdit-py-plugins>=0.4",
    "httpx>=0.27",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vaultserver = "vaultserver.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vaultserver = ["static/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
