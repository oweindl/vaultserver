[project]
name = "vaultserver"
version = "0.1.0"
description = "MCP-Server, Suchindex und Web-Oberfläche für einen Markdown-Vault"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vaultserver = "vaultserver.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
