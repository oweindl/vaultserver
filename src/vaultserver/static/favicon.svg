  <!-- Ecke -->
  <path d="
      M38 10
      V20
      H48"
      fill="none"
      stroke="#C084FC"
      stroke-width="2"/>
  <!-- Kristall -->
  <polygon
      points="
      32,24
      40,29
      40,39
      32,44
      24,39
      24,29"
      fill="url(#crystal)"
